<svg viewBox="0 0 1000 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="scanGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff8c1a" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ff8c1a" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ff8c1a" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <radialGradient id="vignette" cx="50%" cy="50%" r="75%">
      <stop offset="60%" stop-color="#06070a" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>
  </defs>

  <rect width="1000" height="200" fill="#06070a"/>
  <rect width="1000" height="200" fill="url(#grid)"/>

  <rect x="0" y="-60" width="1000" height="60" fill="url(#scanGrad)">
    <animate attributeName="y" values="-60;200" dur="4.5s" repeatCount="indefinite"/>
  </rect>

  <rect width="1000" height="200" fill="url(#vignette)"/>

  <g stroke="#ff8c1a" stroke-width="2" opacity="0.65" fill="none">
    <path d="M 26 46 L 26 26 L 46 26"/>
    <path d="M 954 26 L 974 26 L 974 46"/>
    <path d="M 26 154 L 26 174 L 46 174"/>
    <path d="M 954 174 L 974 174 L 954 154"/>
  </g>

  <text x="26" y="20" font-family="Courier New, monospace" font-size="10" letter-spacing="3" fill="#5a5547">OPERATOR PROFILE // EVIL-SHOWN</text>
  <text x="974" y="20" font-family="Courier New, monospace" font-size="10" letter-spacing="3" fill="#5a5547" text-anchor="end">BUILD v2026.08</text>

  <g transform="translate(500,62)">
    <rect x="-11" y="-11" width="22" height="22" fill="none" stroke="#ff8c1a" stroke-width="1.5" transform="rotate(45)" filter="url(#glow)"/>
    <rect x="-5" y="-5" width="10" height="10" fill="#ff8c1a" transform="rotate(45)" filter="url(#glow)"/>
  </g>

  <text x="500" y="110" text-anchor="middle" font-family="Courier New, monospace" font-size="30" font-weight="700" letter-spacing="6" fill="#ebe4d3">DAMITHA SAMARAKOON</text>

  <line x1="500" y1="124" x2="500" y2="124" stroke="#ff8c1a" stroke-width="2" filter="url(#glow)">
    <animate attributeName="x1" values="500;340;340;500" keyTimes="0;0.4;0.85;1" dur="3.2s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="500;660;660;500" keyTimes="0;0.4;0.85;1" dur="3.2s" repeatCount="indefinite"/>
  </line>

  <text x="500" y="150" text-anchor="middle" font-family="Courier New, monospace" font-size="13" letter-spacing="2" fill="#948e7e">SOFTWARE ENGINEER  ·  SPIL LABS  &#8594;  DEVOPS-BOUND</text>

  <text x="26" y="184" font-family="Courier New, monospace" font-size="10" letter-spacing="2" fill="#5a5547">LOCATION: KANDY, LK</text>

  <g>
    <circle cx="928" cy="180" r="3.5" fill="#ff8c1a">
      <animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="r" values="3;4.5;3" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="940" y="184" font-family="Courier New, monospace" font-size="10" letter-spacing="2" fill="#948e7e">SYSTEM: ONLINE</text>
  </g>
</svg>
